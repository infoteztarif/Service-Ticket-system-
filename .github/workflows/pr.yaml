---
name: Pull Request

permissions:
  contents: read


# pull_request_target runs in the base repository, so secrets are available
# for pull requests from forks. This workflow does not check out pull request code.
on:
  pull_request_target:
    types: [ closed ]

jobs:
  Merged:
    # this job will only run if the PR has been merged
    # and the github.base_ref ends with a 'dev'
    # $GITHUB_BASE_REF / github.base_ref - target branch of the pull request
    if: github.event.pull_request.merged == true && endsWith( github.base_ref, 'dev' )
    runs-on: ubuntu-latest
    env:
      CURL_TOKEN: ${{ secrets.CURL_TOKEN }}
      CURL_DATA: ${{ secrets.CURL_DATA }}
    steps:
    - run: |
        if [ -z "$CURL_TOKEN" ] || [ -z "$CURL_DATA" ]; then
          echo "CURL_TOKEN or CURL_DATA is not set."
          exit 1
        fi
        # Keep compatibility with the existing CURL_DATA secret while avoiding
        # shell evaluation. shlex parses arguments, but metacharacters and
        # command substitutions are passed to curl as plain text.
        python3 - <<'PY'
        import os
        import shlex
        import subprocess

        values = {
            "${CURL_TOKEN}": os.environ["CURL_TOKEN"],
            "${GITHUB_BASE_REF}": os.environ["GITHUB_BASE_REF"],
        }
        arguments = os.environ["CURL_DATA"]
        for placeholder, value in values.items():
            arguments = arguments.replace(placeholder, value)

        subprocess.run(
            ["curl", "--fail-with-body", "--silent", "--show-error", *shlex.split(arguments)],
            check=True,
        )
        PY
